<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#172554" />
		<title>Flarebox is offline</title>
		<style>
			body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f8fafc; color: #172554; font: 16px system-ui, sans-serif; text-align: center; }
			main { max-width: 360px; }
			button { border: 0; border-radius: 8px; padding: 12px 20px; background: #172554; color: white; font: inherit; cursor: pointer; }
		</style>
	</head>
	<body>
		<main>
			<h1>You're offline</h1>
			<p>Connect to the internet to open your inbox.</p>
			<button onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
